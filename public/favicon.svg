<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Swagath Restaurant">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbe9a8"/>
      <stop offset="50%" stop-color="#e0b12a"/>
      <stop offset="100%" stop-color="#8a5e07"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf1bc"/>
      <stop offset="50%" stop-color="#e6bb3a"/>
      <stop offset="100%" stop-color="#9a6b08"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf5cc"/>
      <stop offset="50%" stop-color="#f0cd57"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
  </defs>

  <!-- black medallion + gold rings -->
  <circle cx="32" cy="32" r="30" fill="#0a0806"/>
  <circle cx="32" cy="32" r="28.5" fill="none" stroke="url(#ring)" stroke-width="1.9"/>
  <circle cx="32" cy="32" r="26.5" fill="none" stroke="#d9a92b" stroke-width="0.5" opacity="0.7"/>

  <!-- chef hat -->
  <g fill="url(#gold)">
    <circle cx="32" cy="11.5" r="2.2"/>
    <circle cx="29.2" cy="12.7" r="1.9"/>
    <circle cx="34.8" cy="12.7" r="1.9"/>
    <path d="M29.4 13.9h5.2v0.6c0 0.5-0.3 1.1-0.9 1.1h-3.4c-0.6 0-0.9-0.6-0.9-1.1z"/>
  </g>

  <!-- steam -->
  <path d="M30.6 17.6c-0.7-0.8 0.5-1.4-0.2-2.2 M33.4 17.6c0.7-0.8-0.5-1.4 0.2-2.2"
        fill="none" stroke="url(#gold)" stroke-width="0.7" stroke-linecap="round"/>

  <!-- fork (left) -->
  <g fill="url(#gold)">
    <rect x="23.2" y="22.4" width="0.6" height="2.6" rx="0.3"/>
    <rect x="24.2" y="22.4" width="0.6" height="2.6" rx="0.3"/>
    <rect x="25.2" y="22.4" width="0.6" height="2.6" rx="0.3"/>
    <path d="M23.1 25.2h2.6c0.6 0 1 0.4 1 1v4.2c0 0.4-0.3 0.8-0.7 0.8v3.6c0 0.5-0.4 0.9-0.9 0.9s-0.9-0.4-0.9-0.9v-3.6c-0.4 0-0.7-0.4-0.7-0.8v-4.2c0-0.4 0.6-1 0.6-1z"/>
  </g>

  <!-- spoon (right) -->
  <g fill="url(#gold)">
    <ellipse cx="39" cy="24.4" rx="1.6" ry="2.4"/>
    <rect x="38.6" y="26.8" width="0.8" height="6.4" rx="0.4"/>
  </g>

  <!-- cloche -->
  <circle cx="32" cy="24.4" r="0.7" fill="url(#gold)"/>
  <path d="M26 29.6a6 6 0 0 1 12 0z" fill="url(#gold)"/>
  <rect x="24.2" y="29.6" width="15.6" height="1.2" rx="0.6" fill="url(#gold)"/>

  <!-- green leaves -->
  <g fill="#4a7c2f">
    <path d="M25.4 31.6q1.8-1.8 3.8-0.9q-0.7 2.3-3.8 0.9z"/>
    <path d="M38.6 31.6q-1.8-1.8-3.8-0.9q0.7 2.3 3.8 0.9z"/>
  </g>

  <!-- red ribbons -->
  <path d="M19 32.4q13-2.4 26 0" fill="none" stroke="#93281b" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M21 32.4q11-2 22 0" fill="none" stroke="#c2452c" stroke-width="0.5" stroke-linecap="round" opacity="0.85"/>

  <!-- wordmark -->
  <text x="32" y="40.4" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-weight="700"
        font-size="9.6" letter-spacing="0.5" fill="url(#word)">SWAGATH</text>

  <!-- red swoosh under wordmark -->
  <path d="M21.2 42.4q10.8 2.4 21.6 0" fill="none" stroke="#93281b" stroke-width="0.6" stroke-linecap="round"/>

  <!-- RESTAURANT lockup -->
  <rect x="14" y="44.8" width="5.6" height="0.4" rx="0.2" fill="url(#gold)"/>
  <rect x="44.4" y="44.8" width="5.6" height="0.4" rx="0.2" fill="url(#gold)"/>
  <text x="32" y="45.9" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="2.9" letter-spacing="1.4" fill="#f5eddc">RESTAURANT</text>

  <!-- bottom leaf trio -->
  <g fill="#4a7c2f">
    <path d="M32 51.4q-1.5-2.1-0.4-4q1.6 1.4 0.4 4z"/>
    <path d="M30.4 52.1q-2.1-0.9-3.5 0.5q1.9 1.4 3.5-0.5z"/>
    <path d="M33.6 52.1q2.1-0.9 3.5 0.5q-1.9 1.4-3.5-0.5z"/>
  </g>
</svg>
