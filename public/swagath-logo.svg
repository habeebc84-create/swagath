<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Swagath Restaurant">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#1b1713"/>
      <stop offset="62%" stop-color="#0d0b09"/>
      <stop offset="100%" stop-color="#050404"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbe7a8"/>
      <stop offset="35%" stop-color="#e8bf58"/>
      <stop offset="70%" stop-color="#c8971f"/>
      <stop offset="100%" stop-color="#9a6d12"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f7dd93"/>
      <stop offset="100%" stop-color="#b8871a"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7cc24a"/>
      <stop offset="100%" stop-color="#3d7a1e"/>
    </linearGradient>
    <linearGradient id="swoosh" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c4472a"/>
      <stop offset="100%" stop-color="#7e2413"/>
    </linearGradient>
  </defs>

  <!-- Badge -->
  <circle cx="256" cy="256" r="252" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="246" fill="none" stroke="url(#gold)" stroke-width="5"/>
  <circle cx="256" cy="256" r="235" fill="none" stroke="url(#goldSoft)" stroke-width="1.6" opacity="0.85"/>

  <!-- Chef hat -->
  <g fill="url(#gold)">
    <circle cx="221" cy="116" r="29"/>
    <circle cx="291" cy="116" r="29"/>
    <circle cx="256" cy="100" r="33"/>
    <path d="M219 138 h74 v22 q-37 12 -74 0 z"/>
  </g>
  <path d="M232 162 q24 8 48 0 l-4 16 q-20 6 -40 0 z" fill="url(#goldSoft)"/>

  <!-- Steam curls between hat and dome -->
  <g fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round">
    <path d="M232 186 q-9 -9 0 -18 q9 -9 0 -18"/>
    <path d="M256 190 q-10 -10 0 -20 q10 -10 0 -20"/>
    <path d="M280 186 q-9 -9 0 -18 q9 -9 0 -18"/>
  </g>

  <!-- Fork (left) -->
  <g fill="url(#gold)">
    <rect x="137" y="176" width="6" height="34" rx="3"/>
    <rect x="147" y="176" width="6" height="34" rx="3"/>
    <rect x="157" y="176" width="6" height="34" rx="3"/>
    <path d="M134 208 h32 v10 q-16 8 -32 0 z"/>
    <rect x="146" y="216" width="8" height="74" rx="4"/>
  </g>

  <!-- Spoon (right) -->
  <g fill="url(#gold)">
    <ellipse cx="359" cy="196" rx="16" ry="24"/>
    <rect x="354" y="214" width="9" height="76" rx="4.5"/>
  </g>
  <ellipse cx="359" cy="194" rx="9" ry="15" fill="#171310" opacity="0.55"/>

  <!-- Cloche -->
  <g fill="url(#gold)">
    <circle cx="256" cy="199" r="6"/>
    <rect x="253.5" y="203" width="5" height="9"/>
    <path d="M196 262 a60 56 0 0 1 120 0 z"/>
  </g>
  <path d="M196 262 h120" stroke="#8a6212" stroke-width="2"/>
  <path d="M180 268 q76 18 152 0 q-76 8 -152 0 z" fill="url(#goldSoft)"/>

  <!-- Leaves beside cloche -->
  <path d="M170 258 q-30 -6 -44 -30 q28 -4 46 16 q8 8 -2 14 z" fill="url(#leaf)"/>
  <path d="M342 258 q30 -6 44 -30 q-28 -4 -46 16 q-8 8 2 14 z" fill="url(#leaf)"/>

  <!-- Red swoosh above wordmark -->
  <path d="M116 300 C196 286 316 286 396 300 C316 293 196 293 116 300 Z" fill="url(#swoosh)"/>

  <!-- Wordmark -->
  <text x="256" y="372" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif"
        font-size="82" font-weight="700" letter-spacing="3"
        fill="url(#gold)">SWAGATH</text>

  <!-- Red swoosh under wordmark -->
  <path d="M130 392 C200 381 312 381 382 392 C312 386 200 386 130 392 Z" fill="url(#swoosh)"/>

  <!-- RESTAURANT + flanking rules -->
  <path d="M126 418 h52 M334 418 h52" stroke="url(#goldSoft)" stroke-width="2" stroke-linecap="round"/>
  <text x="256" y="426" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif"
        font-size="23" letter-spacing="9"
        fill="#f2e7cf">RESTAURANT</text>

  <!-- Bottom leaf trio -->
  <g fill="url(#leaf)">
    <path d="M256 442 q-16 6 -30 2 q10 -14 30 -12 z"/>
    <path d="M256 442 q16 6 30 2 q-10 -14 -30 -12 z"/>
    <path d="M256 436 q-7 12 0 24 q7 -12 0 -24 z"/>
  </g>
</svg>
